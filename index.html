<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#FFF9EE" />
  <meta name="description" content="Pocket Shop — a cozy pastel shop management PWA." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/style.css" />
  <title>Pocket Shop</title>
</head>
<body>
  <main class="app-shell">
    <section id="game" class="game" aria-label="Pocket Shop game">
      <header class="hud">
        <div class="hud-row">
          <div class="hud-card coin-card">
            <img src="./assets/icons/icon-coin.png" alt="" />
            <strong id="coins">80</strong>
          </div>
          <div class="hud-card day-card">
            <img src="./assets/icons/icon-calendar.png" alt="" />
            <strong id="dayLabel">Day 1</strong>
          </div>
          <div class="hud-card target-card">
            <img src="./assets/icons/icon-target.png" alt="" />
            <span><small>Target</small><strong id="targetLabel">100</strong></span>
          </div>
        </div>

        <div class="progress-row">
          <img class="sun-icon" src="./assets/icons/icon-sun.png" alt="" />
          <div class="progress-track" aria-label="Daily revenue progress">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <strong id="progressText">0 / 100</strong>
          <img class="gift-icon" src="./assets/icons/icon-gift.png" alt="" />
        </div>
      </header>

      <section class="shop-scene" aria-label="Shop floor">
        <img class="scene-bg" src="./assets/shop/shop-background.png" alt="" />
        <img class="awning" src="./assets/shop/awning.png" alt="" />
        <img class="shop-sign" src="./assets/shop/shop-sign.png" alt="Pocket Shop" />

        <div class="racks" aria-label="Product racks">
          <div class="rack-wrap">
            <img src="./assets/racks/rack-bakery.png" class="rack-img" alt="Bakery rack" />
            <div id="rackBread" class="rack-stock" aria-label="Bread stock"></div>
          </div>
          <div class="rack-wrap">
            <img src="./assets/racks/rack-snacks.png" class="rack-img" alt="Snacks rack" />
            <div id="rackSnack" class="rack-stock" aria-label="Snack stock"></div>
          </div>
          <div class="rack-wrap">
            <img src="./assets/racks/rack-drinks.png" class="rack-img" alt="Drinks rack" />
            <div id="rackMilk" class="rack-stock" aria-label="Milk stock"></div>
          </div>
        </div>

        <img class="counter" src="./assets/shop/counter.png" alt="" />
        <img class="register" src="./assets/shop/register.png" alt="" />
        <img class="cashier" src="./assets/customers/cashier.png" alt="Shop cashier" />
        <img class="shop-cat" src="./assets/shop/shop-cat.png" alt="" />

        <div id="eventBadge" class="event-badge" hidden></div>
        <div id="coinFx" class="coin-fx" aria-hidden="true"></div>
      </section>

      <section class="customer-lane" aria-label="Customer queue">
        <div id="customerGrid" class="customer-grid"></div>
        <div id="laneHint" class="lane-hint">Restock your shelves, then open the shop.</div>
      </section>

      <nav class="bottom-actions" aria-label="Main actions">
        <button id="restockBtn" class="action-btn restock-btn" type="button">
          <span class="action-icon">📦</span><strong>Restock</strong>
        </button>
        <button id="upgradeBtn" class="action-btn upgrade-btn" type="button" disabled aria-describedby="upgradeNote">
          <span class="action-icon">⬆</span><strong>Upgrade</strong>
        </button>
        <button id="openShopBtn" class="action-btn open-btn" type="button">
          <span class="action-icon">🪧</span><strong id="openShopText">Open Shop</strong>
        </button>
      </nav>
      <p id="upgradeNote" class="sr-only">Upgrade is unlocked in the next milestone.</p>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <div id="restockOverlay" class="overlay" hidden>
        <section class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="restockTitle">
          <div class="sheet-grabber" aria-hidden="true"></div>
          <header class="sheet-head">
            <div><small>📦 STOCK UP</small><h2 id="restockTitle">Restock Items</h2></div>
            <button id="closeRestockBtn" class="circle-btn" type="button" aria-label="Close restock">×</button>
          </header>
          <div id="restockCards" class="restock-cards"></div>
        </section>
      </div>

      <div id="summaryOverlay" class="overlay summary-overlay" hidden>
        <section class="summary-card" role="dialog" aria-modal="true" aria-labelledby="summaryTitle">
          <div class="summary-cat">🐱✨</div>
          <h2 id="summaryTitle">Day Complete!</h2>
          <p id="summaryResult" class="summary-result"></p>
          <div class="summary-stats">
            <div><small>Coins earned</small><strong id="sumRevenue">0</strong></div>
            <div><small>Customers served</small><strong id="sumServed">0</strong></div>
            <div><small>Customers lost</small><strong id="sumLost">0</strong></div>
            <div><small>Best seller</small><strong id="sumBest">—</strong></div>
          </div>
          <button id="nextDayBtn" class="next-day-btn" type="button">Next Day →</button>
        </section>
      </div>
    </section>

    <footer class="tiny-footer">Small Shop • Big Happiness</footer>
  </main>

  <script src="./js/data.js" defer></script>
  <script src="./js/save.js" defer></script>
  <script src="./js/game.js" defer></script>
  <script src="./js/ui.js" defer></script>
  <script src="./js/app.js" defer></script>
</body>
</html>
